# Publica el repositorio en Hostinger al hacer push a main.
# Sustituye el disparo automatico que daba el webhook de hPanel (que ya no existe
# en el repositorio de GitHub). No toca .env, uploads ni storage del servidor.
name: Desplegar en Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: 45.93.101.150
      SSH_PORT: "65002"
      SSH_USER: u771496034
      REMOTE_ROOT: /home/u771496034/domains/mikatoestilistascaninos.com/public_html
      HOST_KEY: "[45.93.101.150]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAqdAHoq28bFeC2B4/jYLfgQN9oKlopTazC8OqJiypkX"
    steps:
      - name: Traer repositorio
        uses: actions/checkout@v4

      - name: Preparar SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "[$SSH_HOST]:$SSH_PORT" -f ~/.ssh/known_hosts >/dev/null

      - name: Sincronizar archivos
        run: |
          set -euo pipefail
          rsync -az --delete --timeout=120 \
            --exclude '.git' --exclude '.github' \
            --exclude '.env' --exclude '.env.*' \
            --exclude 'tests' --exclude 'docs' \
            --exclude 'public/uploads' --exclude 'storage' \
            --exclude '.well-known' --exclude 'node_modules' --exclude 'vendor' \
            --exclude '*.log' \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes" \
            ./ "$SSH_USER@$SSH_HOST:$REMOTE_ROOT/"

      - name: Ajustes en el servidor
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd '$REMOTE_ROOT' && chmod -R u+rwX,go+rX . && (php bin/migrate.php || echo '(migracion omitida)') && (php bin/build-ia.php || echo '(corpus omitido)')"
